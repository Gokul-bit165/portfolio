<div style="display:flex;flex-direction:column;gap:16px;font-family:var(--font-sans)">

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 6px">nav</p>
  <div style="width:60px;height:16px;background:var(--surface-1);border-radius:4px"></div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:16px;text-align:center">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 8px">"who we are" intro, casual paragraph</p>
  <div style="height:16px;width:50%;background:var(--surface-1);border-radius:4px;margin:0 auto 8px"></div>
  <div style="height:10px;width:65%;background:var(--surface-1);border-radius:3px;margin:0 auto"></div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 10px">5 member cards: photo, name, role, fun fact, socials</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px">
    <div style="background:var(--surface-1);border-radius:8px;padding:8px">
      <div style="aspect-ratio:1;background:var(--border-strong);border-radius:6px;margin-bottom:6px"></div>
      <div style="height:8px;width:70%;background:var(--border-strong);border-radius:3px"></div>
    </div>
    <div style="background:var(--surface-1);border-radius:8px;padding:8px">
      <div style="aspect-ratio:1;background:var(--border-strong);border-radius:6px;margin-bottom:6px"></div>
      <div style="height:8px;width:70%;background:var(--border-strong);border-radius:3px"></div>
    </div>
    <div style="background:var(--surface-1);border-radius:8px;padding:8px">
      <div style="aspect-ratio:1;background:var(--border-strong);border-radius:6px;margin-bottom:6px"></div>
      <div style="height:8px;width:70%;background:var(--border-strong);border-radius:3px"></div>
    </div>
    <div style="background:var(--surface-1);border-radius:8px;padding:8px">
      <div style="aspect-ratio:1;background:var(--border-strong);border-radius:6px;margin-bottom:6px"></div>
      <div style="height:8px;width:70%;background:var(--border-strong);border-radius:3px"></div>
    </div>
    <div style="background:var(--surface-1);border-radius:8px;padding:8px">
      <div style="aspect-ratio:1;background:var(--border-strong);border-radius:6px;margin-bottom:6px"></div>
      <div style="height:8px;width:70%;background:var(--border-strong);border-radius:3px"></div>
    </div>
  </div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 8px">timeline: how the group started, hackathon milestones</p>
  <div style="display:flex;gap:6px;align-items:center">
    <div style="width:10px;height:10px;border-radius:50%;background:var(--border-strong)"></div>
    <div style="flex:1;height:2px;background:var(--border-strong)"></div>
    <div style="width:10px;height:10px;border-radius:50%;background:var(--border-strong)"></div>
    <div style="flex:1;height:2px;background:var(--border-strong)"></div>
    <div style="width:10px;height:10px;border-radius:50%;background:var(--border-strong)"></div>
  </div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px;text-align:center">
  <p style="font-size:11px;color:var(--text-muted);margin:0">footer</p>
</div>

</div>
