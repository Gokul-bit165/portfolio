<div style="display:flex;flex-direction:column;gap:16px;font-family:var(--font-sans)">

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 6px">nav</p>
  <div style="width:60px;height:16px;background:var(--surface-1);border-radius:4px"></div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:20px;text-align:center">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 10px">big casual headline, e.g. "got an idea? let's build it"</p>
  <div style="height:20px;width:55%;background:var(--surface-1);border-radius:4px;margin:0 auto"></div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:16px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 10px">short form: name, email, project idea</p>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="height:32px;background:var(--surface-1);border-radius:6px"></div>
    <div style="height:32px;background:var(--surface-1);border-radius:6px"></div>
    <div style="height:64px;background:var(--surface-1);border-radius:6px"></div>
    <div style="width:100px;height:32px;border:0.5px solid var(--border-strong);border-radius:6px;align-self:flex-start"></div>
  </div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 10px">or hit us up directly: email, whatsapp, socials</p>
  <div style="display:flex;gap:10px">
    <div style="width:70px;height:20px;background:var(--surface-1);border-radius:12px"></div>
    <div style="width:70px;height:20px;background:var(--surface-1);border-radius:12px"></div>
    <div style="width:70px;height:20px;background:var(--surface-1);border-radius:12px"></div>
  </div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px;text-align:center">
  <p style="font-size:11px;color:var(--text-muted);margin:0">footer</p>
</div>

</div>
