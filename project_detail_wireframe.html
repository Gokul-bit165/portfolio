<div style="display:flex;flex-direction:column;gap:16px;font-family:var(--font-sans)">

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 6px">back link + nav</p>
  <div style="width:70px;height:14px;background:var(--surface-1);border-radius:4px"></div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:16px;text-align:center">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 10px">big project title + one-liner</p>
  <div style="height:20px;width:60%;background:var(--surface-1);border-radius:4px;margin:0 auto 8px"></div>
  <div style="height:12px;width:40%;background:var(--surface-1);border-radius:4px;margin:0 auto"></div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 8px">hero image / demo gif / video embed</p>
  <div style="height:160px;background:var(--surface-1);border-radius:8px"></div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 8px">quick facts row: stack, team, timeline, links</p>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
    <div style="background:var(--surface-1);border-radius:6px;height:44px"></div>
    <div style="background:var(--surface-1);border-radius:6px;height:44px"></div>
    <div style="background:var(--surface-1);border-radius:6px;height:44px"></div>
    <div style="background:var(--surface-1);border-radius:6px;height:44px"></div>
  </div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 8px">the story: problem, what we built, challenges</p>
  <div style="height:10px;width:95%;background:var(--surface-1);border-radius:3px;margin-bottom:6px"></div>
  <div style="height:10px;width:90%;background:var(--surface-1);border-radius:3px;margin-bottom:6px"></div>
  <div style="height:10px;width:70%;background:var(--surface-1);border-radius:3px"></div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 8px">screenshot gallery</p>
  <div style="display:flex;gap:8px;overflow-x:auto">
    <div style="flex:0 0 140px;height:90px;background:var(--surface-1);border-radius:8px"></div>
    <div style="flex:0 0 140px;height:90px;background:var(--surface-1);border-radius:8px"></div>
    <div style="flex:0 0 140px;height:90px;background:var(--surface-1);border-radius:8px"></div>
  </div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px;text-align:center">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 8px">next project teaser + footer</p>
  <div style="height:60px;background:var(--surface-1);border-radius:8px"></div>
</div>

</div>
