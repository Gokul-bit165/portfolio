<div style="display:flex;flex-direction:column;gap:16px;font-family:var(--font-sans)">

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 8px">nav (same as home)</p>
  <div style="display:flex;justify-content:space-between">
    <div style="width:60px;height:16px;background:var(--surface-1);border-radius:4px"></div>
    <div style="width:100px;height:16px;background:var(--surface-1);border-radius:4px"></div>
  </div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 8px">page title + filter tags</p>
  <div style="height:16px;width:45%;background:var(--surface-1);border-radius:4px;margin-bottom:10px"></div>
  <div style="display:flex;gap:8px">
    <div style="width:50px;height:20px;border:0.5px solid var(--border-strong);border-radius:14px"></div>
    <div style="width:50px;height:20px;border:0.5px solid var(--border-strong);border-radius:14px"></div>
    <div style="width:50px;height:20px;border:0.5px solid var(--border-strong);border-radius:14px"></div>
    <div style="width:50px;height:20px;border:0.5px solid var(--border-strong);border-radius:14px"></div>
  </div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px">
  <p style="font-size:11px;color:var(--text-muted);margin:0 0 10px">masonry / offset project grid</p>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
    <div style="height:110px;background:var(--surface-1);border-radius:8px"></div>
    <div style="height:80px;background:var(--surface-1);border-radius:8px;margin-top:20px"></div>
    <div style="height:130px;background:var(--surface-1);border-radius:8px"></div>
    <div style="height:90px;background:var(--surface-1);border-radius:8px"></div>
    <div style="height:110px;background:var(--surface-1);border-radius:8px;margin-top:-10px"></div>
    <div style="height:100px;background:var(--surface-1);border-radius:8px"></div>
  </div>
</div>

<div style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px;text-align:center">
  <p style="font-size:11px;color:var(--text-muted);margin:0">footer (same as home)</p>
</div>

</div>
